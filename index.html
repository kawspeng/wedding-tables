<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>婚禮彈性排桌系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .ghost-card { opacity: 0.4; background: #cbd5e1 !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-rose-600 text-white shadow-md py-4 px-6">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold tracking-wide">💍 婚禮彈性排桌系統</h1>
            <div class="flex flex-wrap gap-2 items-center">
                <label class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-sm font-medium transition shadow cursor-pointer flex items-center gap-1">
                    📂 匯入賓客
                    <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="handleExcelImport(event)">
                </label>
                <button onclick="exportToExcel()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-sm font-medium transition shadow flex items-center gap-1">
                    📊 匯出 Excel
                </button>
                <button onclick="exportToImage()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-lg text-sm font-medium transition shadow flex items-center gap-1">
                    📷 下載座位圖
                </button>
                <button onclick="addNewTable()" class="bg-rose-500 hover:bg-rose-400 text-white px-3 py-2 rounded-lg text-sm font-medium transition shadow">+ 新增桌</button>
                <button onclick="saveData()" class="bg-rose-700 hover:bg-rose-800 text-white px-3 py-2 rounded-lg text-sm font-medium transition shadow">儲存</button>
                <button onclick="resetData()" class="bg-rose-800 hover:bg-rose-900 text-white px-3 py-2 rounded-lg text-sm font-medium transition shadow">重置</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow grid grid-cols-1 lg:grid-cols-4 gap-6 w-full">
        
        <div class="lg:col-span-1 flex flex-col gap-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex-grow flex flex-col">
                <div class="flex justify-between items-center mb-3 border-b pb-2">
                    <h2 class="text-lg font-semibold text-slate-700">👥 待分配賓客</h2>
                    <span id="unassigned-count" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">0 人</span>
                </div>
                
                <form id="addGuestForm" onsubmit="addGuest(event)" class="flex gap-2 mb-4">
                    <input type="text" id="guestNameInput" placeholder="輸入姓名..." required
                        class="flex-grow border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-rose-500 focus:outline-none">
                    <button type="submit" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">新增</button>
                </form>

                <div id="unassigned-categories-container" class="flex-grow overflow-y-auto max-h-[600px] space-y-4 pr-1">
                    </div>
            </div>
        </div>

        <div class="lg:col-span-3 flex flex-col gap-4">
            <div id="capture-area" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-lg font-semibold text-slate-700">🍽️ 現場桌位配置</h2>
                        <p class="text-xs text-slate-500 mt-0.5">提示：每張桌子皆可獨立修改名稱與人數上限；支援滑鼠直接拖曳排位。</p>
                    </div>
                </div>
                
                <div id="tables-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    </div>
            </div>
        </div>

    </main>

    <script>
        let state = {
            unassigned: [
                { id: 'g1', name: '新郎長官 A', note: '男方長官' },
                { id: 'g2', name: '大學同學 - 小明', note: '大學同學' },
                { id: 'g3', name: '伴娘小美', note: '女方親友' }
            ],
            tables: {
                'table-vip': { name: '主桌', capacity: 12, guests: [] },
                'table-1': { name: '第 1 桌', capacity: 10, guests: [] },
                'table-2': { name: '第 2 桌', capacity: 10, guests: [] }
            }
        };

        let sortableInstances = [];

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('wedding_seating_excel_data_v2');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if(parsed.unassigned && parsed.tables) {
                        state = parsed;
                    }
                } catch(e) { console.error('載入存檔失敗', e); }
            }
            renderAll();
        });

        function saveData() {
            localStorage.setItem('wedding_seating_excel_data_v2', JSON.stringify(state));
            alert('儲存成功！資料已保留在您的瀏覽器中。');
        }

        function resetData() {
            if(confirm('確定要重置所有資料嗎？')) {
                localStorage.removeItem('wedding_seating_excel_data_v2');
                location.reload();
            }
        }

        function renderAll() {
            sortableInstances.forEach(instance => instance.destroy());
            sortableInstances = [];

            renderUnassigned();
            renderTables();
            initSortable();
        }

        // 初始化所有拖曳 (包含各個分類區塊與桌子)
        function initSortable() {
            const commonOptions = {
                group: 'wedding',
                animation: 150,
                ghostClass: 'ghost-card',
                onEnd: function(evt) {
                    const itemEl = evt.item;
                    const guestId = itemEl.getAttribute('data-id');
                    const fromContainerId = evt.from.id;
                    const toContainerId = evt.to.id;

                    // 1. 從來源移除該賓客
                    let movedGuest = null;
                    if (fromContainerId.startsWith('cat-')) {
                        let catName = decodeURIComponent(fromContainerId.replace('cat-', ''));
                        let group = state.unassigned.find(g => (g.note || '未分類') === catName);
                        if (group) {
                            let idx = group.guests.findIndex(g => g.id === guestId);
                            if (idx !== -1) movedGuest = group.guests.splice(idx, 1)[0];
                        }
                    } else if (state.tables[fromContainerId]) {
                        let idx = state.tables[fromContainerId].guests.findIndex(g => g.id === guestId);
                        if (idx !== -1) movedGuest = state.tables[fromContainerId].guests.splice(idx, 1)[0];
                    }

                    // 2. 放入目標
                    if (movedGuest) {
                        if (toContainerId.startsWith('cat-')) {
                            let catName = decodeURIComponent(toContainerId.replace('cat-', ''));
                            let group = state.unassigned.find(g => (g.note || '未分類') === catName);
                            if (!group) {
                                group = { note: catName, guests: [] };
                                state.unassigned.push(group);
                            }
                            const targetChildren = Array.from(evt.to.querySelectorAll('div[data-id]'));
                            const newIndex = targetChildren.indexOf(itemEl);
                            if (newIndex >= 0 && newIndex < group.guests.length) {
                                group.guests.splice(newIndex, 0, movedGuest);
                            } else {
                                group.guests.push(movedGuest);
                            }
                        } else if (state.tables[toContainerId]) {
                            let tableGuests = state.tables[toContainerId].guests;
                            const targetChildren = Array.from(evt.to.querySelectorAll('div[data-id]'));
                            const newIndex = targetChildren.indexOf(itemEl);
                            if (newIndex >= 0 && newIndex < tableGuests.length) {
                                tableGuests.splice(newIndex, 0, movedGuest);
                            } else {
                                tableGuests.push(movedGuest);
                            }
                        }
                    }

                    // 清除空的分類
                    state.unassigned = state.unassigned.filter(g => g.guests.length > 0);
                    updateTotalUnassignedCount();
                    updateAllGuestCounts();
                }
            };

            // 綁定所有分類容器
            document.querySelectorAll('.unassigned-category-zone').forEach(el => {
                sortableInstances.push(new Sortable(el, commonOptions));
            });

            // 綁定所有桌子容器
            for(let key in state.tables) {
                const tableEl = document.getElementById(key);
                if(tableEl) {
                    sortableInstances.push(new Sortable(tableEl, commonOptions));
                }
            }
        }

        // --- 按鈕與資料操作 ---

        function addNewTable() {
            const newId = 'table_' + Date.now();
            const tableCount = Object.keys(state.tables).length + 1;
            state.tables[newId] = { name: `第 ${tableCount} 桌`, capacity: 10, guests: [] };
            renderAll();
        }

        function deleteTable(tableKey) {
            if(confirm(`確定要刪除「${state.tables[tableKey].name}」嗎？此桌賓客將移回未分配區。`)) {
                let returnedGuests = state.tables[tableKey].guests;
                returnedGuests.forEach(g => {
                    let note = g.note || '未分類';
                    let group = state.unassigned.find(grp => grp.note === note);
                    if (group) {
                        group.guests.push(g);
                    } else {
                        state.unassigned.push({ note: note, guests: [g] });
                    }
                });
                delete state.tables[tableKey];
                renderAll();
            }
        }

        function addGuest(e) {
            e.preventDefault();
            const input = document.getElementById('guestNameInput');
            const val = input.value.trim();
            if(!val) return;
            const newId = 'g_' + Date.now();
            
            let defaultGroup = state.unassigned.find(g => g.note === '手動新增');
            if(defaultGroup) {
                defaultGroup.guests.push({ id: newId, name: val, note: '手動新增' });
            } else {
                state.unassigned.push({ note: '手動新增', guests: [{ id: newId, name: val, note: '手動新增' }] });
            }

            input.value = '';
            renderAll();
        }

        function removeGuest(id) {
            // 從未分配尋找移除
            state.unassigned.forEach(grp => {
                grp.guests = grp.guests.filter(g => g.id !== id);
            });
            state.unassigned = state.unassigned.filter(g => g.guests.length > 0);

            // 從桌子尋找移除
            for(let key in state.tables) {
                state.tables[key].guests = state.tables[key].guests.filter(g => g.id !== id);
            }
            renderAll();
        }

        // --- 匯出與圖片功能 ---
        function exportToImage() {
            const captureArea = document.getElementById('capture-area');
            alert('正在產生高畫質座位圖，請稍候...');

            html2canvas(captureArea, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '婚禮座位配置圖.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error(err);
                alert('截圖失敗，請稍後再試一次。');
            });
        }

        function exportToExcel() {
            let exportData = [];

            for(let key in state.tables) {
                let table = state.tables[key];
                if(table.guests.length === 0) {
                    exportData.push({
                        "桌名": table.name,
                        "人數上限": table.capacity,
                        "目前人數": 0,
                        "賓客姓名": "(此桌尚無賓客)",
                        "備註/關係": ""
                    });
                } else {
                    table.guests.forEach((g) => {
                        exportData.push({
                            "桌名": table.name,
                            "人數上限": table.capacity,
                            "目前人數": table.guests.length,
                            "賓客姓名": g.name,
                            "備註/關係": g.note || ""
                        });
                    });
                }
            }

            let totalUnassignedCount = 0;
            state.unassigned.forEach(grp => totalUnassignedCount += grp.guests.length);

            if(totalUnassignedCount > 0) {
                state.unassigned.forEach(grp => {
                    grp.guests.forEach(g => {
                        exportData.push({
                            "桌名": `【未分配 - ${grp.note}】`,
                            "人數上限": "-",
                            "目前人數": totalUnassignedCount,
                            "賓客姓名": g.name,
                            "備註/關係": g.note || ""
                        });
                    });
                });
            }

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "婚禮座位表");
            XLSX.writeFile(workbook, "婚禮座位表配置結果.xlsx");
        }

        function handleExcelImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet);
                    
                    if (jsonRows.length === 0) { alert('Excel 內無資料'); return; }

                    let addedCount = 0;
                    jsonRows.forEach((row, index) => {
                        const nameKeys = Object.keys(row).filter(k => /姓|名|賓客|名稱/.test(k));
                        const noteKeys = Object.keys(row).filter(k => /備註|關係|組別|標籤/.test(k));
                        
                        let name = row[nameKeys[0]] || row[Object.keys(row)[0]];
                        let note = row[noteKeys[0]] || row[Object.keys(row)[1]] || '未分類';

                        if (name) {
                            name = String(name).trim();
                            note = String(note).trim() || '未分類';
                            
                            // 檢查是否已存在
                            let existsInUnassigned = state.unassigned.some(grp => grp.guests.some(g => g.name === name));
                            let existsInTable = Object.values(state.tables).some(t => t.guests.some(g => g.name === name));
                            
                            if (!existsInUnassigned && !existsInTable) {
                                const newId = `g_xl_${Date.now()}_${index}`;
                                let guestObj = { id: newId, name: name, note: note };
                                
                                let group = state.unassigned.find(grp => grp.note === note);
                                if (group) {
                                    group.guests.push(guestObj);
                                } else {
                                    state.unassigned.push({ note: note, guests: [guestObj] });
                                }
                                addedCount++;
                            }
                        }
                    });

                    renderAll(); 
                    alert(`成功匯入 ${addedCount} 位賓客！`);
                } catch (err) {
                    console.error(err);
                    alert('讀取 Excel 失敗，請確認檔案格式是否正確。');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function updateTableName(tableKey, newName) {
            if(state.tables[tableKey]) state.tables[tableKey].name = newName;
        }

        function updateTableCapacity(tableKey, newCapacity) {
            const cap = parseInt(newCapacity) || 1;
            if(state.tables[tableKey]) {
                state.tables[tableKey].capacity = cap;
                updateAllGuestCounts();
            }
        }

        // 渲染左側分類群組
        function renderUnassigned() {
            const container = document.getElementById('unassigned-categories-container');
            container.innerHTML = '';
            
            updateTotalUnassignedCount();

            if(state.unassigned.length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-400 text-center py-6">所有賓客皆已入座！</div>`;
                return;
            }

            state.unassigned.forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'bg-slate-50 border border-slate-200 rounded-xl p-3';
                
                const safeCategoryName = encodeURIComponent(group.note);

                groupDiv.innerHTML = `
                    <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-200">
                        <span class="text-xs font-bold text-slate-600 truncate">📂 ${group.note}</span>
                        <span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded-full">${group.guests.length} 人</span>
                    </div>
                    <div id="cat-${safeCategoryName}" class="unassigned-category-zone min-h-[40px] space-y-2">
                        </div>
                `;
                
                container.appendChild(groupDiv);

                const zone = groupDiv.querySelector(`#cat-${safeCategoryName}`);
                group.guests.forEach(g => {
                    zone.appendChild(createGuestElement(g));
                });
            });
        }

        function updateTotalUnassignedCount() {
            let total = 0;
            state.unassigned.forEach(grp => total += grp.guests.length);
            const countEl = document.getElementById('unassigned-count');
            if(countEl) countEl.innerText = `${total} 人`;
        }

        function renderTables() {
            const container = document.getElementById('tables-container');
            container.innerHTML = '';

            for(let key in state.tables) {
                let table = state.tables[key];
                const tableCard = document.createElement('div');
                tableCard.className = `bg-white border rounded-xl p-4 flex flex-col shadow-sm border-slate-200`;
                
                tableCard.innerHTML = `
                    <div class="flex flex-col gap-2 mb-3 pb-2 border-b border-slate-200">
                        <div class="flex justify-between items-center gap-2">
                            <input type="text" value="${table.name}" oninput="updateTableName('${key}', this.value)"
                                class="font-bold text-sm bg-slate-50 border border-slate-200 rounded px-2 py-1 flex-grow focus:ring-1 focus:ring-rose-500 focus:outline-none">
                            <button type="button" onclick="deleteTable('${key}')" class="text-slate-400 hover:text-rose-600 text-xs px-1.5 py-1" title="刪除此桌">🗑️</button>
                        </div>
                        <div class="flex justify-between items-center text-xs">
                            <div class="flex items-center gap-1 text-slate-500">
                                <span>上限:</span>
                                <input type="number" value="${table.capacity}" min="1" max="30" oninput="updateTableCapacity('${key}', this.value)"
                                    class="w-14 border border-slate-200 bg-slate-50 rounded px-1 py-0.5 text-center focus:ring-1 focus:ring-rose-500 focus:outline-none">
                                <span>人</span>
                            </div>
                            <span id="count-${key}" class="font-semibold px-2 py-0.5 rounded-full">
                                ${table.guests.length} / ${table.capacity} 人
                            </span>
                        </div>
                    </div>
                    <div id="${key}" class="table-drop-zone flex-grow min-h-[100px] space-y-2 p-1 bg-slate-50/50 rounded-lg">
                        </div>
                `;
                
                container.appendChild(tableCard);

                const guestContainer = tableCard.querySelector(`#${key}`);
                table.guests.forEach(g => {
                    guestContainer.appendChild(createGuestElement(g));
                });
            }
            updateAllGuestCounts();
        }

        function createGuestElement(g) {
            const el = document.createElement('div');
            el.className = 'bg-white p-2 rounded-md shadow-sm border border-slate-200 flex justify-between items-center cursor-grab active:cursor-grabbing text-sm hover:border-rose-200';
            el.setAttribute('data-id', g.id);
            
            el.innerHTML = `
                <div class="flex items-center overflow-hidden">
                    <span class="font-medium text-slate-700 truncate">👤 ${g.name}</span>
                </div>
                <button type="button" onclick="removeGuest('${g.id}')" class="text-slate-300 hover:text-rose-600 text-xs px-1.5 shrink-0" title="移除">✕</button>
            `;
            return el;
        }

        function updateAllGuestCounts() {
            for(let key in state.tables) {
                let table = state.tables[key];
                let badge = document.getElementById(`count-${key}`);
                if(badge) {
                    badge.innerText = `${table.guests.length} / ${table.capacity} 人`;
                    if (table.guests.length >= table.capacity) {
                        badge.className = 'font-semibold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700';
                    } else {
                        badge.className = 'font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700';
                    }
                }
            }
        }
    </script>
</body>
</html>
